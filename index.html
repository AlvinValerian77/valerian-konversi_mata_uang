<!DOCTYPE html>
<html lang="id" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valerian Ex v11.5 - Unified Branding</title>

    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <meta name="theme-color" content="#3730a3"> 

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { 
                extend: { 
                    colors: { brand: '#6366f1', accent: '#f59e0b' },
                    borderRadius: { '5xl': '3rem' }
                } 
            }
        }
    </script>
</head>
<body class="text-slate-900 dark:text-slate-100 min-h-screen pb-32">

    <header class="max-w-2xl mx-auto p-6 flex justify-between items-center sticky top-0 z-50 bg-white/80 dark:bg-slate-950/80 backdrop-blur-xl">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-brand rounded-2xl flex items-center justify-center shadow-lg shadow-brand/30 overflow-hidden border-2 border-white dark:border-slate-800">
                <img src="logo.png" alt="Logo" class="w-full h-full object-cover">
            </div>
            <div>
                <h1 class="text-xl font-[800] tracking-tighter uppercase text-brand italic">Valerian.Ex</h1>
                <p id="live-clock" class="text-[9px] font-bold opacity-40 uppercase tracking-widest mt-1"></p>
            </div>
        </div>
        <div class="flex gap-2">
            <select id="lang" onchange="updateUI()" class="bg-slate-100 dark:bg-slate-900 text-[10px] font-[800] p-2 rounded-xl outline-none border border-transparent focus:border-brand cursor-pointer">
                <option value="id">ID</option>
                <option value="en">EN</option>
            </select>
            <button onclick="document.documentElement.classList.toggle('dark')" class="w-10 h-10 bg-slate-100 dark:bg-slate-900 rounded-xl flex items-center justify-center text-brand transition active:scale-90">
                <i class="fas fa-circle-half-stroke"></i>
            </button>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-5 mt-4">
        <section id="page-tukar" class="page-node active space-y-6">
            <div class="bg-white dark:bg-slate-900 rounded-[2.5rem] p-7 shadow-xl border border-slate-100 dark:border-slate-800">
                <h2 id="l-title-tukar" class="text-xs font-[800] opacity-30 uppercase tracking-[0.2em] mb-6 text-center">Kalkulator Konversi</h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                    <div class="space-y-2">
                        <label id="l-amt" class="text-[10px] font-bold opacity-40 uppercase ml-2 tracking-wide">Nominal</label>
                        <input type="number" id="amount" value="1000" class="w-full bg-slate-50 dark:bg-slate-800/50 p-4 rounded-2xl text-2xl font-[800] outline-none border-2 border-transparent focus:border-brand transition">
                    </div>
                    <div class="space-y-2">
                        <label id="l-fee" class="text-[10px] font-bold text-accent uppercase ml-2 tracking-wide">Admin Fee (%)</label>
                        <input type="number" id="fee" value="0" step="0.1" class="w-full bg-amber-50/50 dark:bg-amber-950/20 p-4 rounded-2xl text-2xl font-[800] outline-none border-2 border-transparent focus:border-accent text-accent transition text-center">
                    </div>
                </div>

                <div class="space-y-3 relative">
                    <div class="relative" id="cont-from">
                        <div onclick="toggleDrop('from')" class="w-full bg-slate-50 dark:bg-slate-800/50 p-5 rounded-2xl cursor-pointer flex justify-between items-center border border-slate-100 dark:border-slate-800 group hover:border-brand transition">
                            <div class="flex items-center gap-3">
                                <span class="w-8 h-8 flex items-center justify-center bg-brand/10 text-brand rounded-lg text-[10px] font-bold">FR</span>
                                <span id="display-from" class="font-bold text-xs uppercase">USD - United States Dollar</span>
                            </div>
                            <i class="fas fa-chevron-down text-[10px] opacity-20"></i>
                        </div>
                        <div id="drop-from" class="drop-list absolute z-50 w-full mt-2 bg-white dark:bg-slate-900 rounded-2xl shadow-2xl p-4 border border-slate-100 dark:border-slate-800">
                            <input type="text" id="search-from" oninput="filter('from')" placeholder="Cari Mata Uang..." class="w-full p-3 mb-2 bg-slate-100 dark:bg-slate-800 rounded-xl outline-none text-xs font-bold">
                            <div id="list-from" class="max-h-60 overflow-y-auto custom-scroll space-y-1"></div>
                        </div>
                    </div>

                    <div class="flex justify-center -my-3 relative z-10">
                        <button onclick="swap()" class="w-10 h-10 bg-brand text-white rounded-xl shadow-lg hover:rotate-180 transition-all duration-500 flex items-center justify-center active:scale-90 border-4 border-white dark:border-slate-900 shadow-brand/30">
                            <i class="fas fa-right-left"></i>
                        </button>
                    </div>

                    <div class="relative" id="cont-to">
                        <div onclick="toggleDrop('to')" class="w-full bg-slate-50 dark:bg-slate-800/50 p-5 rounded-2xl cursor-pointer flex justify-between items-center border border-slate-100 dark:border-slate-800 group hover:border-brand transition">
                            <div class="flex items-center gap-3">
                                <span class="w-8 h-8 flex items-center justify-center bg-emerald-500/10 text-emerald-500 rounded-lg text-[10px] font-bold">TO</span>
                                <span id="display-to" class="font-bold text-xs uppercase">IDR - Indonesian Rupiah</span>
                            </div>
                            <i class="fas fa-chevron-down text-[10px] opacity-20"></i>
                        </div>
                        <div id="drop-to" class="drop-list absolute z-50 w-full mt-2 bg-white dark:bg-slate-900 rounded-2xl shadow-2xl p-4 border border-slate-100 dark:border-slate-800">
                            <input type="text" id="search-to" oninput="filter('to')" placeholder="Cari Mata Uang..." class="w-full p-3 mb-2 bg-slate-100 dark:bg-slate-800 rounded-xl outline-none text-xs font-bold">
                            <div id="list-to" class="max-h-60 overflow-y-auto custom-scroll space-y-1"></div>
                        </div>
                    </div>
                </div>

                <div class="mt-10 bg-brand p-8 rounded-[3rem] text-white text-center shadow-2xl shadow-brand/30 relative group overflow-hidden">
                    <img src="" class="absolute -right-4 -top-4 w-24 opacity-10 grayscale brightness-200 pointer-events-none">
                    <button onclick="copyResult()" class="absolute top-4 right-4 bg-white/10 p-3 rounded-xl hover:bg-white/20 transition z-20"><i class="fas fa-copy text-xs"></i></button>
                    <p id="l-res" class="text-[9px] font-bold opacity-60 uppercase tracking-widest mb-2">Net Amount Received</p>
                    <h2 id="output" class="text-3xl font-[800] tracking-tighter mb-1 relative z-10">--</h2>
                    <p id="label-currency" class="text-[10px] font-bold opacity-80 uppercase italic tracking-widest mb-6 relative z-10">Currency Name</p>
                    
                    <div class="pt-6 border-t border-white/10 relative z-10">
                        <p id="l-spell" class="text-[8px] font-bold opacity-40 uppercase mb-2 tracking-widest">Ejaan Terbilang</p>
                        <p id="spellout" class="text-[11px] font-semibold italic leading-relaxed px-2">--</p>
                    </div>
                    <div id="status" class="mt-6 text-[8px] font-bold opacity-30 uppercase tracking-widest flex justify-center items-center gap-2"></div>
                </div>
            </div>

            <div class="bg-slate-900 text-white rounded-3xl p-5 flex items-center justify-between shadow-lg">
                <div class="flex items-center gap-3">
                    <div id="market-dot" class="w-3 h-3 rounded-full"></div>
                    <div>
                        <h4 id="l-market" class="text-[9px] font-bold opacity-40 uppercase tracking-widest">Market Intelligence</h4>
                        <p id="market-status" class="text-xs font-bold tracking-tight uppercase">Checking...</p>
                    </div>
                </div>
                <i class="fas fa-earth-americas opacity-20 text-lg"></i>
            </div>
        </section>

        <section id="page-kurs" class="page-node space-y-4">
            <div class="px-2">
                <h2 id="l-quick" class="text-sm font-[800] text-brand uppercase tracking-widest">Market Rates (IDR Base)</h2>
                <p class="text-[10px] font-bold opacity-30 uppercase mt-1 tracking-widest italic">Update Real-time dari Pasar Global</p>
            </div>
            <div id="quick-list" class="grid grid-cols-1 gap-3"></div>
        </section>

        <section id="page-history" class="page-node space-y-4">
            <div class="flex justify-between items-center px-2">
                <div>
                    <h2 id="l-hist" class="text-sm font-[800] text-brand uppercase tracking-widest">Recent Activity</h2>
                    <p class="text-[10px] font-bold opacity-30 uppercase mt-1 tracking-widest italic">Catatan konversi terakhir kamu</p>
                </div>
                <button onclick="clearHistory()" class="text-[10px] font-bold text-rose-500 bg-rose-500/10 px-4 py-2 rounded-xl transition hover:bg-rose-500/20 active:scale-95">Clear History</button>
            </div>
            <div id="history-container" class="space-y-3"></div>
        </section>
    </main>

    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-md bg-white dark:bg-slate-900 border border-slate-100 dark:border-slate-800 p-3 rounded-[2.5rem] flex justify-around items-center z-50 shadow-2xl">
        <button onclick="switchPage('tukar', this)" class="nav-item active flex flex-col items-center gap-1 transition-all duration-300">
            <div class="icon-box w-12 h-10 rounded-2xl flex items-center justify-center transition">
                <i class="fas fa-shuffle text-xl"></i>
            </div>
            <span class="text-[9px] font-[800] uppercase tracking-tighter">Konversi</span>
        </button>
        <button onclick="switchPage('kurs', this)" class="nav-item opacity-30 flex flex-col items-center gap-1 transition-all duration-300">
            <div class="icon-box w-12 h-10 rounded-2xl flex items-center justify-center transition">
                <i class="fas fa-chart-line text-xl"></i>
            </div>
            <span class="text-[9px] font-[800] uppercase tracking-tighter">Market</span>
        </button>
        <button onclick="switchPage('history', this)" class="nav-item opacity-30 flex flex-col items-center gap-1 transition-all duration-300">
            <div class="icon-box w-12 h-10 rounded-2xl flex items-center justify-center transition">
                <i class="fas fa-history text-xl"></i>
            </div>
            <span class="text-[9px] font-[800] uppercase tracking-tighter">Riwayat</span>
        </button>
    </nav>

    <script src="script.js"></script>
</body>
</html>
